<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aura migraine tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEBF2; --surface:#F8F7FB; --surface-2:#E3E1EC; --ink:#24222E; --muted:#5C586D; --line:#D2CFDD;
  --accent:#574A93; --accent-ink:#FFFFFF; --accent-soft:#DDD8F1;
  --attack:#9E3A5E; --attack-ink:#FFFFFF; --attack-soft:#F2DCE5;
  --calm:#3B7462; --calm-ink:#FFFFFF; --calm-soft:#D4E7DF;
  --warn:#7A500F; --warn-soft:#F4E6CB;
  --c1:#6B5CB0; --c2:#B0507A; --c3:#3A8A7C; --c4:#C08A2E; --c5:#4A73B8; --c6:#7F8A3A; --unk:#CFCBDA;
  --backdrop:rgba(24,22,34,.45);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17161F; --surface:#211F2C; --surface-2:#2C2A3A; --ink:#DEDBEA; --muted:#A39FB6; --line:#383549;
    --accent:#A99BE6; --accent-ink:#17161F; --accent-soft:#322D4F;
    --attack:#E58AA9; --attack-ink:#1E1219; --attack-soft:#44263A;
    --calm:#7CC2A8; --calm-ink:#10201A; --calm-soft:#1F3830;
    --warn:#E7BD70; --warn-soft:#3B3020;
    --c1:#A99BE6; --c2:#E58AA9; --c3:#72C2B0; --c4:#E2B35F; --c5:#86A8E8; --c6:#B8C374; --unk:#3D3A50;
    --backdrop:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17161F; --surface:#211F2C; --surface-2:#2C2A3A; --ink:#DEDBEA; --muted:#A39FB6; --line:#383549;
  --accent:#A99BE6; --accent-ink:#17161F; --accent-soft:#322D4F;
  --attack:#E58AA9; --attack-ink:#1E1219; --attack-soft:#44263A;
  --calm:#7CC2A8; --calm-ink:#10201A; --calm-soft:#1F3830;
  --warn:#E7BD70; --warn-soft:#3B3020;
  --c1:#A99BE6; --c2:#E58AA9; --c3:#72C2B0; --c4:#E2B35F; --c5:#86A8E8; --c6:#B8C374; --unk:#3D3A50;
  --backdrop:rgba(0,0,0,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
p{margin:0 0 .6em}
.app{max-width:560px;margin:0 auto;padding:0 18px calc(104px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 10px}
.brand{display:flex;align-items:center;gap:8px;margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.top-actions{display:flex;align-items:center;gap:8px}
.sync{font-size:13px;color:var(--muted);margin-right:4px;white-space:nowrap}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.icon-btn svg,.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

h2{font-size:21px;line-height:1.25;margin:30px 0 10px;letter-spacing:-.01em}
h2.page-t{font-size:28px;margin:14px 0 14px}
h3{font-size:15px;color:var(--muted);margin:22px 0 8px}
.muted{color:var(--muted)}
.small-t{font-size:14px}

.start-btn{display:block;width:100%;min-height:118px;margin:6px 0 4px;padding:20px 22px;border:0;border-radius:22px;background:var(--attack);color:var(--attack-ink);text-align:left}
.start-title{display:block;font-size:26px;font-weight:700;line-height:1.15}
.start-sub{display:block;margin-top:8px;font-size:15px;opacity:.9}
.ongoing{background:var(--attack-soft);border-radius:22px;padding:20px 20px 18px;margin:6px 0 4px}
.ongoing .k{font-size:22px;font-weight:700;color:var(--attack);margin-bottom:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.card > :last-child{margin-bottom:0}
.card.risk{background:var(--attack-soft);border-color:transparent}
.card.warn{background:var(--warn-soft);border-color:transparent}
.card.warn .card-t{color:var(--warn)}
.card.risk .card-t{color:var(--attack)}
.card.good{background:var(--calm-soft);border-color:transparent}
.card-t{font-weight:700;font-size:18px;margin-bottom:6px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.btn.small{min-height:40px;padding:0 14px;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.attack{background:var(--attack);border-color:var(--attack);color:var(--attack-ink)}
.btn.danger{color:var(--attack);border-color:var(--attack)}
.btn.link{border:0;background:none;padding:0;min-height:44px;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.grow{flex:1}

.daynav{display:flex;align-items:center;gap:8px;margin:26px 0 4px}
.daynav .lbl{flex:1;min-width:0}
.daynav .d1{font-size:24px;font-weight:700;line-height:1.2}
.daynav .d2{font-size:14px;color:var(--muted)}
.date-pick{position:relative;width:44px;height:44px}
.date-pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.date-pick span{pointer-events:none}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;line-height:1.25;text-align:left}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.sign[aria-pressed="true"]{background:var(--calm);border-color:var(--calm);color:var(--calm-ink)}
.chip.wide{width:100%;text-align:center}
.group-note{font-size:14px;color:var(--muted);margin:-2px 0 10px;max-width:60ch}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input{flex:1;min-width:0}

/* Grouped lists, in the style of Apple Health */
.gsec{margin:12px 0}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
dialog .gcard{background:var(--bg)}
.ghead{width:100%;display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 14px;border:0;background:none;text-align:left;color:var(--ink)}
.gicon{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;color:var(--surface)}
.gicon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gtitle{flex:1;min-width:0;font-weight:700;font-size:17px;line-height:1.25}
.gsum{display:block;font-weight:400;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcount{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;display:grid;place-items:center;flex:none}
.gchev{width:18px;height:18px;flex:none;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.ghead[aria-expanded="true"] .gchev{transform:rotate(90deg)}
.grow-row{position:relative;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:11px 16px;border:0;background:none;text-align:left;font-size:17px;line-height:1.3;color:var(--ink)}
.grow-row::before,.gadd::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:1px solid var(--line)}
.gcard > :first-child::before{display:none}
.grow-row.in,.gadd.in{padding-left:58px}
.grow-row.in::before,.gadd.in::before{left:58px}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.grow-row[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.grow-row.sign[aria-pressed="true"] .tick{background:var(--calm);border-color:var(--calm)}
.grow-row[aria-pressed="true"] .tick::after{content:"";width:10px;height:5px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.grow-row.sign[aria-pressed="true"] .tick::after{border-color:var(--calm-ink)}
.gadd{position:relative;display:flex;align-items:center;gap:8px;padding:7px 10px 7px 16px}
.gadd input{flex:1;min-width:0;border:0;background:none;padding:8px 0;min-height:40px}
.gadd input:focus-visible{outline:none}
.gadd:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.gfoot{font-size:13px;color:var(--muted);margin:6px 16px 0;line-height:1.4}
.glabel{font-size:13px;color:var(--muted);margin:24px 16px 6px}
.grow-row .stepper{gap:8px}
.grow-row .stepper .icon-btn{width:36px;height:36px;border-radius:50%}
.grow-row .stepper .v{min-width:52px;font-size:17px}
.gnote{display:block;width:100%;border:0 !important;border-top:1px solid var(--line) !important;border-radius:0 !important;background:none !important;padding:12px 16px !important;min-height:84px}

.field{display:block;font-weight:700;font-size:15px;margin:18px 0 6px}
input[type=text],input[type=datetime-local],input[type=date],textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
textarea{min-height:88px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent);height:36px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:400}
.check input{width:22px;height:22px;accent-color:var(--accent)}

.stepper{display:flex;align-items:center;gap:10px}
.stepper .v{min-width:92px;text-align:center;font-size:20px;font-weight:700}

.since{display:flex;align-items:flex-end;gap:14px;margin:6px 0 10px}
.since-n{font-size:clamp(92px,30vw,140px);line-height:.82;font-weight:700;letter-spacing:-.05em;color:var(--accent)}
.since-u{font-size:20px;line-height:1.25;padding-bottom:6px}
.since-t{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:18px 0}
.stat{background:var(--surface);padding:12px 12px 10px}
.stat-v{font-size:22px;font-weight:700;line-height:1.2}
.stat-l{font-size:13px;color:var(--muted);line-height:1.3}

.cal-h{display:flex;align-items:center;justify-content:space-between;margin:28px 0 8px}
.cal-h h2{margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:12px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal button{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px;position:relative;padding:0}
.cal button.logged::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.cal button.att{background:var(--attack-soft);border-color:transparent;background:color-mix(in srgb,var(--attack) calc(20% + var(--i) * 7%),var(--surface))}
.cal button.att.strong{color:var(--attack-ink);font-weight:700}
.cal button.att.logged::after{background:currentColor}
.cal button.today{outline:2px solid var(--ink);outline-offset:-2px}
.cal button.future{opacity:.45}
.cal-key{display:flex;gap:18px;font-size:13px;color:var(--muted);margin-top:8px}
.cal-key span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent)}

.tl{list-style:none;padding:0;margin:0}
.tl li{padding:12px 0;border-bottom:1px solid var(--line)}
.tl li:last-child{border-bottom:0}
.tl .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tl .name{font-weight:700}
.tl .num{font-size:14px;color:var(--muted);white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--surface-2);margin:8px 0 6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.sign span{background:var(--calm)}
.tag{display:inline-block;font-size:13px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.tag.hi{background:var(--attack-soft);color:var(--attack);font-weight:700}
.tag.lo{background:var(--calm-soft);color:var(--calm)}

.mig{padding:16px 0;border-bottom:1px solid var(--line)}
.mig:last-child{border-bottom:0}
.mig-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.mig-d{font-weight:700;margin:0}
.mig-m{font-size:15px;color:var(--muted);margin:2px 0 0}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:12px 0 8px;background:var(--unk)}
.stack span{display:block;height:100%}
.stack span + span{border-left:2px solid var(--surface)}
.legend{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px}
.legend li{display:inline-flex;align-items:center;gap:6px}
.signs{font-size:14px;color:var(--muted);margin:8px 0 0}

.facts{list-style:none;padding:0;margin:0}
.facts li{padding:12px 0;border-bottom:1px solid var(--line)}
.facts li:last-child{border-bottom:0}
.vbars{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px;align-items:end;margin-top:6px}
.vbars .col{display:flex;flex-direction:column;align-items:center;gap:4px}
.vbars .b{width:100%;max-width:34px;height:80px;display:flex;align-items:flex-end;background:var(--surface-2);border-radius:8px;overflow:hidden}
.vbars .b span{display:block;width:100%;background:var(--accent)}
.vbars .l{font-size:12px;color:var(--muted)}
.vbars .c{font-size:12px;font-weight:700}

.tips{margin:0;padding-left:1.2em}
.tips li{margin:6px 0}
.links{list-style:none;padding:0;margin:0}
.links a{display:block;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.links li:last-child a{border-bottom:0}
.links .lt{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.links .ld{display:block;font-size:14px;color:var(--muted)}

.empty{padding:10px 0}
.empty .lead{font-size:22px;font-weight:700}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{min-height:62px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;color:var(--muted)}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}

dialog{border:0;padding:0;border-radius:20px;width:min(560px,calc(100vw - 20px));max-height:calc(100% - 32px);background:var(--surface);color:var(--ink);overflow:auto}
dialog::backdrop{background:var(--backdrop)}
.sheet{padding:20px 20px 22px}
.sheet h2{margin:0 0 4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .chip{flex:1;text-align:center;min-width:88px}
.sheet-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.int-row{display:flex;align-items:center;gap:14px}
.int-row output{font-size:24px;font-weight:700;min-width:54px;text-align:right}
.manage{list-style:none;padding:0;margin:0}
.manage li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.manage li.off span{color:var(--muted);text-decoration:line-through}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--accent)}
.steps{padding-left:1.3em;margin:6px 0}
.steps li{margin:4px 0}

.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:min(520px,calc(100vw - 32px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <p class="brand"><svg id="mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"></svg>Aura</p>
    <div class="top-actions">
      <span class="sync" id="sync" role="status">Connecting</span>
      <button class="icon-btn" data-act="theme" aria-label="Switch between dim and light screen" title="Dim or light screen">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button class="icon-btn" data-act="settings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg>
      </button>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
</div>

<nav class="tabbar" aria-label="Pages">
  <div class="in">
    <button class="tab" data-act="tab" data-view="log"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Log</button>
    <button class="tab" data-act="tab" data-view="history"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>History</button>
    <button class="tab" data-act="tab" data-view="insights"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Insights</button>
  </div>
</nav>

<dialog id="attackDlg" aria-labelledby="attackTitle">
  <div class="sheet">
    <h2 id="attackTitle">Migraine details</h2>
    <p class="muted small-t">Fill in what you can. Everything except the start time is optional.</p>
    <label class="field" for="aStart">Started</label>
    <input type="datetime-local" id="aStart">
    <label class="check"><input type="checkbox" id="aOngoing"> Still going</label>
    <label class="field" for="aEnd">Ended</label>
    <input type="datetime-local" id="aEnd">
    <label class="field" for="aInt">Worst pain</label>
    <div class="int-row"><input type="range" id="aInt" min="1" max="10" step="1" value="5"><output id="aIntOut" for="aInt">5/10</output></div>
    <p class="field">Aura (visual or other disturbance before or during)</p>
    <div class="seg" data-seg="aura">
      <button class="chip" data-act="seg" data-v="yes" aria-pressed="false">Yes</button>
      <button class="chip" data-act="seg" data-v="no" aria-pressed="false">No</button>
    </div>
    <p class="field">Symptoms</p>
    <div class="gcard" id="aSym"></div>
    <label class="check" style="margin-top:14px"><input type="checkbox" id="aMeds"> I took medication for it</label>
    <label class="field" for="aMedName">What you took</label>
    <input type="text" id="aMedName" placeholder="Optional" autocomplete="off">
    <p class="field">Relief</p>
    <div class="seg" data-seg="relief">
      <button class="chip" data-act="seg" data-v="none" aria-pressed="false">None</button>
      <button class="chip" data-act="seg" data-v="some" aria-pressed="false">Some</button>
      <button class="chip" data-act="seg" data-v="full" aria-pressed="false">Complete</button>
    </div>
    <label class="field" for="aNote">Notes</label>
    <textarea id="aNote" placeholder="Anything else you noticed"></textarea>
    <div class="sheet-actions">

/* ---------- data access ---------- */
function getLogs() { const out = {}; for (const k in S.months) { const L = S.months[k].logs; for (const d in L) out[d] = L[d]; } return out; }

  const arr = [];

    return Array.from(s);

  const ids = new Set();
  logged.forEach(d => Object.keys(logs[d].t || {}).forEach(k => ids.add(k)));

    const present = aw.filter(x => x.ids.indexOf(id) >= 0).length;

  const sleepBefore = attacks.map(a => logs[a.start.slice(0, 10)] && logs[a.start.slice(0, 10)].sleep).filter(v => typeof v === 'number');

function factorList(an, ids, sign) {
  return '<ul class="tl">' + ids.map(id => {
    const p = an.per[id];

function renderHistory() {

  }

  const linkList = arr => '<ul class="links">' + arr.map(l => '<li><a href="' + esc(l.u) + '" target="_blank" rel="noopener noreferrer"><span class="lt">' + esc(l.t) + '</span><span class="ld">' + esc(l.d) + '</span></a></li>').join('') + '</ul>';
  h += '<h2>Latest research</h2><p class="muted small-t">These links run live searches, so they always show the newest published papers rather than a fixed list.</p>';
  if (personal.length) h += '<h3>Based on your log</h3><div class="card">' + linkList(personal) + '</div>';

function buildCSV() {
  const an = analyze(), rows = [['type', 'date', 'start', 'end', 'duration_hours', 'worst_pain_1_10', 'aura', 'symptoms', 'medication_taken', 'medication', 'relief', 'factors', 'hours_slept', 'notes']];
  const symName = k => (SYMPTOMS.find(s => s[0] === k) || [k, k])[1];
  const recs = [];
  Object.keys(an.logs).forEach(d => { const L = an.logs[d]; recs.push({k: d + ' 0', r: ['day', d, '', '', '', '', '', '', '', '', '', L.none ? 'nothing unusual' : Object.keys(L.t || {}).map(label).join('; '), typeof L.sleep === 'number' ? L.sleep : '', L.note || '']}); });
  an.attacks.forEach(a => {
    const sh = an.shares(a);
    recs.push({k: a.start.slice(0, 10) + ' 1', r: ['migraine', a.start.slice(0, 10), a.start.replace('T', ' '), a.end ? a.end.replace('T', ' ') : '', a.end ? round1(hoursBetween(a.start, a.end)) : '', a.intensity || '', a.aura === true ? 'yes' : a.aura === false ? 'no' : '', (a.sym || []).map(symName).join('; '), a.meds ? 'yes' : 'no', a.medName || '', a.relief || '', sh.parts.map(p => label(p.id)).concat(sh.signs.map(label)).join('; '), '', a.note || '']});
  });
  recs.sort((x, y) => x.k < y.k ? -1 : 1).forEach(x => rows.push(x.r));
  return rows.map(r => r.map(v => { const s = String(v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
}
function downloadFile(name, data, type) {
  try {
    const url = URL.createObjectURL(new Blob([data], {type}));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000); return true;
  } catch (e) { return false; }
}
function saveBackup() {
  const body = JSON.stringify({app: 'aura-migraine-tracker', version: 1, saved: new Date().toISOString(), settings: S.settings, months: S.months});
  if (downloadFile('aura-backup-' + todayStr() + '.json', body, 'application/json')) {
    S.settings.lastBackup = todayStr(); S.settings.backupSnooze = null; persist(); render();
    toast('Backup saved. Keep it somewhere safe, such as the Files app.');
  } else toast('The backup could not be saved in this browser.');
}
function restoreFrom(text) {
  let p; try { p = JSON.parse(text); } catch (e) { toast('That file is not a backup from this tracker.'); return; }
  if (!p || p.app !== 'aura-migraine-tracker' || !p.months) { toast('That file is not a backup from this tracker.'); return; }
  const n = mergeIn({settings: p.settings, months: p.months}).length;
  persist(); render();
  toast(n ? 'Backup restored. Anything already on this device was kept.' : 'Everything in that backup is already on this device.');
}
function backupDue() {
  if (!hasData()) return false;
  const st = S.settings, today = todayStr();
  if (st.backupSnooze && st.backupSnooze > today) return false;
  return !st.lastBackup || daysBetween(st.lastBackup, today) >= 30;
}

  if (downloadFile(name, csv, 'text/csv')) { toast('Exported ' + name); return; }
  const box = $('#csvFallback');
  if (box) { box.innerHTML = '<label class="field" for="csvText">Copy this into a spreadsheet or email</label><textarea id="csvText" readonly style="min-height:160px;font-size:13px"></textarea>'; $('#csvText').value = csv; $('#csvText').select(); }
}
async function wipeAll() {
  Sync.holdRemote = true;
  await deleteSynced();
  S = {settings: DEFAULT_SETTINGS(), months: {}};
  saveLocal();
  Sync.holdRemote = false;
  if (Sync.col) Sync.mode = 'setup';
  wipeArmed = false; setSync(); toast('All data deleted.'); render();
}

/* ---------- attack dialog ---------- */
const dlg = $('#attackDlg');
function setSeg(name, v) { dlg.querySelectorAll('[data-seg="' + name + '"] .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v))); }
function getSeg(name) { const b = dlg.querySelector('[data-seg="' + name + '"] .chip[aria-pressed="true"]'); return b ? b.dataset.v : ''; }
function openAttack(a, mk, isNew) {
  editing = {id: a.id, mk, isNew}; delArmed = false;
  $('#attackTitle').textContent = isNew ? 'Add a migraine' : 'Migraine details';
  $('#aStart').value = a.start || '';
  $('#aOngoing').checked = isOngoing(a) && !isNew;
  $('#aEnd').value = a.end || '';
  $('#aEnd').disabled = $('#aOngoing').checked;
  $('#aInt').value = a.intensity || 5; $('#aIntOut').textContent = (a.intensity || 5) + '/10';
  setSeg('aura', a.aura === true ? 'yes' : a.aura === false ? 'no' : '');
  setSeg('relief', a.relief || '');
  const sym = a.sym || [];
  $('#aSym').innerHTML = SYMPTOMS.map(s => '<button class="grow-row" data-act="dlg-chip" data-v="' + s[0] + '" aria-pressed="' + (sym.indexOf(s[0]) >= 0) + '"><span>' + s[1] + '</span><span class="tick" aria-hidden="true"></span></button>').join('');
  $('#aMeds').checked = !!a.meds; $('#aMedName').value = a.medName || ''; $('#aNote').value = a.note || '';
  $('#aDelWrap').style.display = isNew ? 'none' : '';
  $('#aDel').textContent = 'Delete this migraine';
  dlg.showModal();
}
function saveAttack() {
  if (!editing) return;
  const start = $('#aStart').value, ongoing = $('#aOngoing').checked, end = ongoing ? null : ($('#aEnd').value || null);
  if (!start) { toast('Add the start time to save.'); $('#aStart').focus(); return; }
  if (end && end < start) { toast('The end time is before the start time.'); $('#aEnd').focus(); return; }
  const aura = getSeg('aura');
  const data = {
    start, end: ongoing ? null : end, intensity: +$('#aInt').value,
    aura: aura === 'yes' ? true : aura === 'no' ? false : null,
    sym: Array.from($('#aSym').querySelectorAll('[aria-pressed="true"]')).map(b => b.dataset.v),
    meds: $('#aMeds').checked, medName: $('#aMedName').value.trim().slice(0, 120), relief: getSeg('relief'),
    note: $('#aNote').value.trim().slice(0, 2000), updated: Date.now()
  };
  if (!ongoing && !end) data.lenUnknown = true;
  const newMk = monthKey(start.slice(0, 10));
  if (editing.mk && editing.mk !== newMk && S.months[editing.mk]) { delete S.months[editing.mk].attacks[editing.id]; persist(editing.mk); }
  ensureMonth(newMk).attacks[editing.id] = data;
  persist(newMk);
  dlg.close(); editing = null;
  toast('Migraine saved.'); render();
}
function deleteAttack() {
  if (!delArmed) { delArmed = true; $('#aDel').textContent = 'Tap again to delete'; return; }
  if (editing && editing.mk && S.months[editing.mk]) { delete S.months[editing.mk].attacks[editing.id]; persist(editing.mk); }
  dlg.close(); editing = null; toast('Migraine deleted.'); render();
}
$('#aOngoing').addEventListener('change', e => { $('#aEnd').disabled = e.target.checked; if (e.target.checked) $('#aEnd').value = ''; });
$('#aInt').addEventListener('input', e => { $('#aIntOut').textContent = e.target.value + '/10'; });

/* ---------- log actions ---------- */
function dayLog(d, create) {
  const m = create ? ensureMonth(monthKey(d)) : S.months[monthKey(d)];
  if (!m) return null;
  if (!m.logs[d] && create) m.logs[d] = {t: {}};
  return m.logs[d] || null;
}
function tidyDay(d) {
  const m = S.months[monthKey(d)]; if (!m) return; const L = m.logs[d]; if (!L) return;
  if (!L.none && !Object.keys(L.t || {}).length && typeof L.sleep !== 'number' && !L.note) delete m.logs[d];
}
function touch(d) { const L = dayLog(d, true); L.updated = Date.now(); tidyDay(d); persist(monthKey(d)); }

function startAttack() {
  const now = new Date(), start = localDT(now), id = newId(), mk = monthKey(start.slice(0, 10));
  ensureMonth(mk).attacks[id] = {start, end: null, intensity: 5, aura: null, sym: [], meds: false, medName: '', relief: '', note: '', updated: Date.now()};
  persist(mk);
  cur.date = todayStr();
  render();
  toast('Migraine logged at ' + fmtTime(start) + '. Add details when you feel up to it.');
}
function endAttack(id, mk) {
  const a = S.months[mk] && S.months[mk].attacks[id]; if (!a) return;
  let end = localDT(new Date()); if (end < a.start) end = a.start;
  a.end = end; a.updated = Date.now(); persist(mk); render();
  openAttack(Object.assign({}, a, {id}), mk, false);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch (act) {
    case 'tab': cur.view = b.dataset.view; render(true); window.scrollTo(0, 0); $('#view').focus({preventScroll: true}); break;
    case 'start-attack': startAttack(); break;
    case 'end-attack': endAttack(id, b.dataset.mk); break;
    case 'edit-attack': { const a = S.months[b.dataset.mk] && S.months[b.dataset.mk].attacks[id]; if (a) openAttack(Object.assign({}, a, {id}), b.dataset.mk, false); break; }
    case 'new-attack': {
      const d = cur.view === 'log' ? cur.date : todayStr();
      openAttack({id: newId(), start: d + 'T' + (d === todayStr() ? localDT(new Date()).slice(11) : '09:00'), intensity: 5}, null, true); break;
    }
    case 'cat': {
      const c = b.dataset.cat; if (cur.open.has(c)) cur.open.delete(c); else cur.open.add(c);
      lsSet('aura-open', JSON.stringify(Array.from(cur.open))); render(); break;
    }
    case 'toggle': {
      const d = cur.date, L = dayLog(d, true); L.t = L.t || {};
      if (L.t[id]) delete L.t[id]; else { L.t[id] = 1; delete L.none; }
      touch(d); render(); break;
    }
    case 'none': { const d = cur.date, L = dayLog(d, true); if (L.none) delete L.none; else L.none = true; touch(d); render(); break; }
    case 'sleep-minus': case 'sleep-plus': {
      const d = cur.date, L = dayLog(d, true);
      let v = typeof L.sleep === 'number' ? L.sleep : 7.5;
      if (typeof L.sleep === 'number') v += act === 'sleep-plus' ? 0.5 : -0.5;
      L.sleep = Math.min(16, Math.max(0, v)); touch(d); render(); break;
    }
    case 'sleep-clear': { const L = dayLog(cur.date, true); delete L.sleep; touch(cur.date); render(); break; }
    case 'day-prev': cur.date = addDays(cur.date, -1); render(true); break;
    case 'day-next': if (cur.date < todayStr()) { cur.date = addDays(cur.date, 1); render(true); } break;
    case 'day-today': cur.date = todayStr(); render(true); break;
    case 'add-custom': addCustom(); break;
    case 'cal-prev': case 'cal-next': {
      const p = cur.calMonth.split('-').map(Number), dt = new Date(p[0], p[1] - 1 + (act === 'cal-next' ? 1 : -1), 1);
      cur.calMonth = dt.getFullYear() + '-' + pad(dt.getMonth() + 1); render(true); break;
    }
    case 'cal-day': cur.date = b.dataset.date; cur.view = 'log'; render(true); window.scrollTo(0, 0); break;
    case 'theme': {
      const eff = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const next = eff === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; lsSet(THEME_KEY, next); break;
    }
    case 'settings': wipeArmed = false; $('#setBody').innerHTML = renderSettings(); $('#setDlg').showModal(); break;
    case 'close-dlg': { const d = b.closest('dialog'); if (d) d.close(); break; }
    case 'save-attack': saveAttack(); break;
    case 'del-attack': deleteAttack(); break;
    case 'dlg-chip': b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')); break;
    case 'seg': { const grp = b.closest('[data-seg]'); const was = b.getAttribute('aria-pressed') === 'true'; grp.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false')); if (!was) b.setAttribute('aria-pressed', 'true'); break; }
    case 'win': S.settings.window = +b.dataset.w; persist('settings'); render(); break;
    case 'hide-toggle': { const h = S.settings.hidden, i = h.indexOf(id); if (i >= 0) h.splice(i, 1); else h.push(id); persist('settings'); render(); break; }
    case 'del-custom': { const c = S.settings.custom.find(x => x.id === id); if (c) c.removed = true; persist('settings'); render(); toast('Removed. Past logs keep it.'); break; }
    case 'export': doExport(); break;
    case 'backup': saveBackup(); break;
    case 'backup-later': S.settings.backupSnooze = addDays(todayStr(), 7); persist(); render(); break;
    case 'sync-setup': setupSync(($('#setPass') || {}).value || '', ($('#setPass2') || {}).value || '', !!($('#setAck') || {}).checked); break;
    case 'sync-unlock': unlockSync(($('#unlockPass') || {}).value || ''); break;
    case 'sync-forgot': forgotPass(); break;
    case 'sync-lock': lockDevice(); break;
    case 'wipe': if (!wipeArmed) { wipeArmed = true; $('#setBody').innerHTML = renderSettings(); } else wipeAll(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.actChange === 'pick-date' && t.value) { cur.date = t.value > todayStr() ? todayStr() : t.value; render(true); }
  if (t.dataset.actChange === 'restore-file' && t.files && t.files[0]) { const r = new FileReader(); r.onload = () => restoreFrom(String(r.result)); r.onerror = () => toast('That file could not be read.'); r.readAsText(t.files[0]); t.value = ''; }
  if (t.dataset.actChange === 'note') { const L = dayLog(cur.date, true); L.note = t.value.trim().slice(0, 2000); touch(cur.date); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'customIn') { e.preventDefault(); addCustom(); }
  if (e.target.id === 'unlockPass') { e.preventDefault(); unlockSync(e.target.value); }
  if (e.target.id === 'setPass2') { e.preventDefault(); const b = document.querySelector('[data-act="sync-setup"]'); if (b) b.click(); }
});
function addCustom() {
  const inp = $('#customIn'); if (!inp) return;
  const v = inp.value.trim().slice(0, 60); if (!v) { inp.focus(); return; }
  const existing = allItems().find(i => i.label.toLowerCase() === v.toLowerCase() && !i.removed);
  const L = dayLog(cur.date, true); L.t = L.t || {};
  if (existing) { L.t[existing.id] = 1; }
  else { const id = 'c_' + newId(); S.settings.custom.push({id, label: v}); persist('settings'); L.t[id] = 1; }
  delete L.none; touch(cur.date); inp.value = ''; render(true);
  toast('Added “' + v + '” and marked it for ' + (cur.date === todayStr() ? 'today' : fmtDate(cur.date)) + '.');
}

let toastTimer = null;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3800); }

/* ---------- brand mark: an aura's zigzag arc ---------- */
(function () {
  const pts = []; const n = 11;
  for (let i = 0; i < n; i++) { const a = (-215 + i * (230 / (n - 1))) * Math.PI / 180, r = i % 2 ? 8 : 12.5; pts.push((16 + r * Math.cos(a)).toFixed(1) + ' ' + (16 + r * Math.sin(a)).toFixed(1)); }
  $('#mark').innerHTML = '<path d="M' + pts.join(' L') + '" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
})();

/* ---------- start ---------- */
const savedTheme = lsGet(THEME_KEY); if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.dataset.theme = savedTheme;
loadLocal();
render(true);
initCapabilities();
setInterval(() => { const t = todayStr(); if (t !== render._day) { if (render._day && cur.date === render._day) cur.date = t; render._day = t; render(); } }, 60000);
render._day = todayStr();
})();
</script>
